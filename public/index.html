<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星星五子棋 · 和同事来一局</title>
    <meta name="description" content="轻松可分享的本地双人五子棋游戏" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky-decoration sky-left" aria-hidden="true">✦</div>
    <div class="sky-decoration sky-right" aria-hidden="true">✧</div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">♟</div>
          <div>
            <p class="eyebrow">LOCAL PARTY GAME</p>
            <h1>星星五子棋</h1>
          </div>
        </div>
        <div class="connection-pill" id="connectionPill" data-state="connecting">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="connectionText">正在连接房间…</span>
        </div>
      </header>

      <section class="game-layout" aria-label="五子棋游戏区域">
        <section class="board-stage">
          <div class="board-heading">
            <div><span class="round-label">ROOM <b id="roomCodeLabel">------</b></span><h2 id="gameStatus">等待对手加入</h2></div>
            <div class="board-actions"><button class="icon-button" id="soundButton" title="切换音效" aria-label="切换音效">♫</button><button class="icon-button" id="resetButton" title="重新开始" aria-label="重新开始">↻</button></div>
          </div>
          <div class="board-viewport" id="boardViewport" aria-label="五子棋棋盘">
            <div class="board-wrap" id="boardWrap">
              <div class="board-shadow" aria-hidden="true"></div>
              <div class="board" id="board" role="grid" aria-label="15×15 五子棋棋盘"></div>
              <div class="last-move-dot" id="lastMoveDot" aria-hidden="true"></div>
              <div class="turn-hand" id="turnHand" aria-hidden="true">👆</div>
            </div>
          </div>
          <p class="board-hint" id="boardHint">点击棋盘落子 · 黑棋先行</p>
        </section>

        <aside class="side-panel right-panel" aria-label="在线玩家大厅">
          <section class="lobby-card">
            <div class="share-title"><span>在线大厅</span><span class="online-count" id="onlineCount">0 人在线</span></div>
            <form class="nickname-form" id="nicknameForm"><label for="nicknameInput">你的昵称</label><div class="nickname-row"><input id="nicknameInput" maxlength="12" placeholder="输入昵称加入大厅" autocomplete="nickname" /><button type="submit">更新</button></div></form>
            <div class="online-list" id="onlineList"><p class="empty-lobby">正在寻找在线玩家…</p></div>
          </section>
        </aside>
      </section>

      <footer class="footer"><span>Made for tiny breaks · 玩得开心</span><span>连接地址：<b id="addressLabel">读取中…</b></span></footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="round-banner" id="roundBanner" role="status" aria-live="polite"></div>
    <dialog class="invite-dialog" id="inviteDialog"><div class="dialog-icon">✉</div><h3 id="inviteTitle">收到对战邀请</h3><p id="inviteMessage">有玩家邀请你来一局五子棋</p><div class="dialog-actions"><button class="dialog-reject" id="rejectInvite">稍后再说</button><button class="dialog-accept" id="acceptInvite">接受挑战</button></div></dialog>
    <dialog class="result-dialog" id="resultDialog"><div class="fireworks" id="fireworks" aria-hidden="true"></div><div class="result-emoji" id="resultEmoji">🎉</div><h3 class="art-font" id="resultTitle">你赢了！</h3><p class="art-font" id="resultMessage">太棒啦，继续保持！</p><button class="result-button" id="resultRestart" type="button">再来一局</button></dialog>
    <script src="app.js"></script>
  </body>
</html>
