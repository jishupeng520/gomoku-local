<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星星五子棋 · 和同事来一局</title>
    <meta name="description" content="轻松可分享的本地双人五子棋游戏" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky-decoration sky-left" aria-hidden="true">✦</div>
    <div class="sky-decoration sky-right" aria-hidden="true">✧</div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">♟</div>
          <div>
            <p class="eyebrow">LOCAL PARTY GAME</p>
            <h1>星星五子棋</h1>
          </div>
        </div>
        <div class="connection-pill" id="connectionPill" data-state="connecting">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="connectionText">正在连接房间…</span>
        </div>
      </header>

      <section class="game-layout" aria-label="五子棋游戏区域">
        <aside class="side-panel left-panel">
          <div class="player-card player-card-black active" id="blackPlayerCard">
            <div class="player-avatar avatar-sun">☀</div>
            <div class="player-info"><strong>小太阳</strong><span>黑棋 · 先手</span></div>
            <span class="turn-badge" id="blackTurnBadge">你的回合</span>
          </div>
          <div class="score-card">
            <span>本局比分</span>
            <strong><b id="blackScore">0</b><i>:</i><b id="whiteScore">0</b></strong>
            <small>三局两胜 · 轻松玩</small>
          </div>
          <div class="tip-card">
            <span class="tip-icon" aria-hidden="true">💡</span>
            <p>连成五颗棋子<br />就能赢下星星啦！</p>
          </div>
        </aside>

        <section class="board-stage">
          <div class="board-heading">
            <div><span class="round-label">ROOM <b id="roomCodeLabel">------</b></span><h2 id="gameStatus">等待对手加入</h2></div>
            <div class="board-actions"><button class="icon-button" id="soundButton" title="切换音效" aria-label="切换音效">♫</button><button class="icon-button" id="resetButton" title="重新开始" aria-label="重新开始">↻</button></div>
          </div>
          <div class="board-wrap" id="boardWrap">
            <div class="board-shadow" aria-hidden="true"></div>
            <div class="board" id="board" role="grid" aria-label="15×15 五子棋棋盘"></div>
            <div class="last-move-dot" id="lastMoveDot" aria-hidden="true"></div>
          </div>
          <div class="zoom-controls" aria-label="棋盘缩放">
            <button id="zoomOut" aria-label="缩小棋盘">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="放大棋盘">＋</button>
          </div>
          <p class="board-hint" id="boardHint">点击棋盘落子 · 黑棋先行</p>
        </section>

        <aside class="side-panel right-panel">
          <div class="player-card player-card-white" id="whitePlayerCard">
            <div class="player-avatar avatar-moon">☾</div>
            <div class="player-info"><strong>月亮同事</strong><span>白棋 · 后手</span></div>
            <span class="turn-badge" id="whiteTurnBadge">等你落子</span>
          </div>
          <div class="share-card">
            <div class="share-title"><span>邀请同事来玩</span><span class="share-sparkle">✦</span></div>
            <div class="qr-placeholder" id="qrPlaceholder" aria-label="房间二维码占位"><span>⌁</span><small>扫码加入房间</small></div>
            <p class="share-url" id="shareUrl">正在生成分享地址…</p>
            <button class="share-button" id="copyButton">复制房间链接 <span>↗</span></button>
          </div>
          <div class="room-note"><span>⌁</span> 同一 Wi‑Fi 下打开链接<br />&nbsp;&nbsp;&nbsp;就可以面对面开战</div>
          <section class="lobby-card" aria-label="在线玩家大厅">
            <div class="share-title"><span>在线大厅</span><span class="online-count" id="onlineCount">0 人在线</span></div>
            <form class="nickname-form" id="nicknameForm"><label for="nicknameInput">你的昵称</label><div class="nickname-row"><input id="nicknameInput" maxlength="12" placeholder="输入昵称加入大厅" autocomplete="nickname" /><button type="submit">更新</button></div></form>
            <div class="online-list" id="onlineList"><p class="empty-lobby">正在寻找在线玩家…</p></div>
          </section>
        </aside>
      </section>

      <footer class="footer"><span>Made for tiny breaks · 玩得开心</span><span>连接地址：<b id="addressLabel">读取中…</b></span></footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog class="invite-dialog" id="inviteDialog"><div class="dialog-icon">✉</div><h3 id="inviteTitle">收到对战邀请</h3><p id="inviteMessage">有玩家邀请你来一局五子棋</p><div class="dialog-actions"><button class="dialog-reject" id="rejectInvite">稍后再说</button><button class="dialog-accept" id="acceptInvite">接受挑战</button></div></dialog>
    <script src="app.js"></script>
  </body>
</html>
